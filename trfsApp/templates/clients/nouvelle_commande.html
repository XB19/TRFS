{% extends "clients/base_dashboard.html" %}
{% load static %}

{% block content %}

<style>

/* CENTRAGE GLOBAL */
.page-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
    padding:30px 15px;
}

/* CONTAINER */
.form-container{
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    max-width:650px;
    width:100%;
}

/* TITRES */
h2{
    margin-bottom:8px;
    color:#ff7a00;
    font-size:22px;
    text-align:center;
}

.subtitle{
    margin-bottom:20px;
    color:#666;
    font-size:14px;
    text-align:center;
}

/* FORM FIELDS */
input, textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:14px;
    box-sizing:border-box;
}

input:focus, textarea:focus{
    border-color:#1f7a3a;
}

textarea{
    min-height:120px;
    resize:none;
}

/* BUTTON */
.btn{
    background:#ff7a00;
    color:white;
    padding:12px 22px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
    width:100%;
}

.btn:hover{
    background:#1f7a3a;
}

</style>

<div class="page-wrapper">

<div class="form-container">

    <h2>Envoyer un colis</h2>

    <div class="subtitle">
        Remplissez les informations de votre colis. Notre équipe vous contactera pour validation.
    </div>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="type_marchandise" placeholder="Type de marchandise (colis, fragile...)" required>

        <input type="number" step="0.01" name="poids_kg" placeholder="Poids (kg)">

        <input type="number" step="0.01" name="volume_m3" placeholder="Volume (m³)">

        <input type="text" name="lieu_depart" placeholder="Lieu de départ" required>

        <input type="text" name="destination" placeholder="Destination" required>

        <input type="date" name="date_expedition" required>

        <textarea name="description" placeholder="Description du colis (optionnel)"></textarea>

        <button class="btn" type="submit">Créer la demande</button>
    </form>

</div>

</div>

{% endblock %}
