{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Admin - TRFS</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CARD */
.login-container{
    background:#fff;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    width:100%;
    max-width:400px;
    text-align:center;
}

/* LOGO */
.logo{
    margin-bottom:20px;
}

.logo img{
    width:120px;
}

/* TITLE */
h2{
    margin-bottom:25px;
    color:#ff7a00;
}

/* INPUT */
.input-group{
    text-align:left;
    margin-bottom:15px;
}

.input-group label{
    font-size:13px;
    color:#555;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-top:5px;
    outline:none;
}

input:focus{
    border-color:#ff7a00;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#ff7a00;
    border:none;
    color:#fff;
    border-radius:30px;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#e56d00;
}

/* ERROR */
.error{
    background:#ffe5e5;
    color:#c00;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="login-container">

    <!-- LOGO -->
    <div class="logo">
        <img src="{% static 'images/logo.png' %}" alt="TRFS">
    </div>

    <h2>Connexion Admin</h2>

    <!-- ERREUR -->
    {% if messages %}
        {% for message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit">Se connecter</button>
    </form>

</div>

</body>
</html>
